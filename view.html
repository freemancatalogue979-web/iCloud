<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote view</title>
<style>
  html, body { height:100%; margin:0; background:#fff; overflow:hidden; }
  #mirror { width:100%; height:100%; border:0; display:block; }
</style>
</head>
<body>
  <!-- Only the mirrored page lives here. -->
  <iframe id="mirror" title="Mirrored page" sandbox="allow-same-origin"></iframe>

<script>
  const mirror = document.getElementById("mirror");
  const FRAME_SELECTOR = 'iframe, frame, object[type="text/html"][data]';
  const WIN_ID = "data-rb-frame";

  // windowId -> the Document that frame was captured into.
  const docs = new Map();

  const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
  let ws = null;

  // -------------------------------------------------------------- paths
  // Selector segments are child indexes; "#" steps into a shadow root.
  function resolve(doc, sel) {
    if (!doc || !doc.body) return null;
    if (sel === "") return doc.body;
    let node = doc.body;
    for (const part of sel.split("/")) {
      if (part === "#") node = node.shadowRoot;
      else node = node.children ? node.children[+part] : null;
      if (!node) return null;
    }
    return node;
  }

  function applyPatch(doc, patch) {
    for (const p of patch) {
      const el = resolve(doc, p.sel);
      if (!el) return false;               // structure drifted - need a resync

      if (p.t === "a") {
        if (p.value === null) el.removeAttribute(p.name);
        else el.setAttribute(p.name, p.value);
      } else if (p.t === "t") {
        if (el.firstChild && el.firstChild.nodeType === 3) el.firstChild.data = p.value;
        else el.textContent = p.value;
      } else if (p.t === "h") {
        el.innerHTML = p.html;
      }
    }
    return true;
  }

  // ------------------------------------------------------------- frames
  // windowId "0.1.2": from the root document take frame 1, enter it, take 2.
  // The agent wrote the id onto each frame element, so this is a lookup, not a
  // guess at which iframe holds which origin.
  function frameDoc(windowId) {
    if (windowId === "0") return docs.get("0");
    const parentDoc = frameDoc(windowId.slice(0, windowId.lastIndexOf(".")));
    if (!parentDoc) return null;
    const el = parentDoc.querySelector("[" + WIN_ID + "=\"" + windowId + "\"]");
    return el ? el.contentDocument : null;
  }

  // Frames arrive deepest-last in the capture list, so a parent's document
  // always exists before its children are filled in.
  function fillFrame(frame) {
    const parentDoc = frame.windowId === "0" ? docs.get("0") : frameDoc(frame.windowId.slice(0, frame.windowId.lastIndexOf(".")));
    if (!parentDoc) return false;
    const el = parentDoc.querySelector("[" + WIN_ID + "=\"" + frame.windowId + "\"]");
    if (!el) return false;
    el.setAttribute("sandbox", "allow-same-origin");
    el.onload = () => {
      docs.set(frame.windowId, el.contentDocument);
      if (el.contentDocument) wireInput(el.contentDocument);
    };
    el.srcdoc = frame.html;
    return true;
  }

  let pendingFrames = [];
  let pendingTimer = null;

  function drainPending() {
    const still = [];
    for (const frame of pendingFrames) {
      if (!fillFrame(frame)) still.push(frame);
    }
    pendingFrames = still;
    if (pendingFrames.length && !pendingTimer) {
      pendingTimer = setTimeout(() => { pendingTimer = null; drainPending(); }, 150);
    }
  }

  function seed(frames) {
    docs.clear();
    const root = frames.find((f) => f.windowId === "0") || frames[0];
    if (!root) return;
    mirror.onload = () => {
      docs.set("0", mirror.contentDocument);
      if (mirror.contentDocument) wireInput(mirror.contentDocument);
      drainPending();
    };
    mirror.srcdoc = root.html;
    pendingFrames = frames.filter((f) => f !== root);
    if (!pendingTimer) pendingTimer = setTimeout(() => { pendingTimer = null; drainPending(); }, 150);
  }

  // -------------------------------------------------------------- input
  function wireInput(doc) {
    const NAMED = new Set(["Enter","Tab","Backspace","Delete","Escape",
      "ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Home","End","PageUp","PageDown"]);

    doc.addEventListener("mousedown", (ev) => {
      const rect = mirror.getBoundingClientRect();
      post("/click", {
        x: (ev.clientX - rect.left) * (1280 / rect.width),
        y: (ev.clientY - rect.top) * (800 / rect.height),
      });
      ev.preventDefault();
    }, true);

    doc.addEventListener("keydown", (ev) => {
      if (NAMED.has(ev.key)) { post("/key", { key: ev.key }); ev.preventDefault(); }
      else if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      else if (ev.key.length === 1) { post("/keys", { text: ev.key }); ev.preventDefault(); }
    }, true);
  }

  function post(path, body) {
    fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).catch(() => {});
  }

  // ------------------------------------------------------------- stream
  function connect() {
    ws = new WebSocket(wsProto + "//" + location.host + "/ws");

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.kind === "doc") {
        seed(msg.frames || []);
        return;
      }

      if (msg.kind === "mut") {
        const doc = docs.get(msg.windowId);
        if (!doc || !doc.body) return;
        if (!applyPatch(doc, msg.patch)) ws.send(JSON.stringify({ cmd: "resync" }));
      }
    };

    ws.onclose = () => setTimeout(connect, 400);
  }

  connect();
</script>
</body>
</html>
