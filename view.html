<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote view</title>
<style>
  html, body { height:100%; margin:0; background:#fff; overflow:hidden; }
  #mirror { width:100%; height:100%; border:0; display:block; }
</style>
</head>
<body>
  <!-- Only the mirrored page lives here. -->
  <iframe id="mirror" title="Mirrored page" sandbox="allow-same-origin"></iframe>

<script>
  const mirror = document.getElementById("mirror");

  // frameId -> { doc, el }. Root document plus one entry per nested frame.
  const frames = new Map();
  // Mutations can arrive before a frame's document has loaded; hold them.
  const queued = new Map();
  // Child frames whose parent iframe we have not matched yet.
  const orphaned = new Map();

  const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
  let ws = null;

  // -------------------------------------------------------------- paths
  function resolve(doc, sel) {
    if (!doc || !doc.body) return null;
    if (sel === "") return doc.body;
    let node = doc.body;
    for (const part of sel.split("/")) {
      if (!node || !node.children) return null;
      node = node.children[+part];
      if (!node) return null;
    }
    return node;
  }

  function applyPatch(doc, patch) {
    for (const p of patch) {
      const el = resolve(doc, p.sel);
      if (!el) return false;               // structure drifted - need a resync

      if (p.t === "a") {
        if (p.value === null) el.removeAttribute(p.name);
        else el.setAttribute(p.name, p.value);
      } else if (p.t === "t") {
        if (el.firstChild && el.firstChild.nodeType === 3) el.firstChild.data = p.value;
        else el.textContent = p.value;
      } else if (p.t === "h") {
        el.innerHTML = p.html;
      }
    }
    return true;
  }

  // ------------------------------------------------------------- frames
  function register(frameId, doc) {
    frames.set(frameId, { doc });
    const backlog = queued.get(frameId);
    if (backlog && backlog.length) {
      queued.delete(frameId);
      for (const patch of backlog) applyPatch(doc, patch);
    }
  }

  function realSrc(iframe) {
    // agent.js rewrites src to /res?url=<encoded real url>
    const src = iframe.getAttribute("src") || "";
    if (src.startsWith("/res?url=")) {
      try { return decodeURIComponent(src.slice("/res?url=".length)); } catch (e) {}
    }
    return src;
  }

  function findIframeFor(doc, url) {
    if (!url) return null;
    let target;
    try { target = new URL(url); } catch (e) { return null; }

    for (const frame of doc.querySelectorAll("iframe")) {
      if (frame.dataset.rbFrame) continue;
      let candidate;
      try { candidate = new URL(realSrc(frame), target.href); } catch (e) { continue; }
      if (candidate.origin === target.origin && candidate.pathname === target.pathname) {
        frame.dataset.rbFrame = "1";
        return frame;
      }
    }
    return null;
  }

  function seedRoot(message) {
    mirror.onload = () => register(message.frame, mirror.contentDocument);
    mirror.srcdoc = message.html;
    // A child frame may have reported before the root finished loading.
    retryOrphans();
  }

  function seedChild(message) {
    const parent = frames.get(message.parent);
    if (!parent || !parent.doc) {
      orphaned.set(message.frame, message);
      setTimeout(retryOrphans, 200);
      return;
    }

    const el = findIframeFor(parent.doc, message.frameUrl || message.url);
    if (!el) {
      orphaned.set(message.frame, message);
      setTimeout(retryOrphans, 300);
      return;
    }

    orphaned.delete(message.frame);
    // Swap the real cross-origin src for our own copy of its DOM.
    el.removeAttribute("src");
    el.setAttribute("sandbox", "allow-same-origin");
    el.onload = () => register(message.frame, el.contentDocument);
    el.srcdoc = message.html;
  }

  function retryOrphans() {
    for (const message of [...orphaned.values()]) seedChild(message);
  }

  // -------------------------------------------------------------- input
  function wireInput(doc) {
    const NAMED = new Set(["Enter","Tab","Backspace","Delete","Escape",
      "ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Home","End","PageUp","PageDown"]);

    doc.addEventListener("mousedown", (ev) => {
      const rect = mirror.getBoundingClientRect();
      post("/click", {
        x: (ev.clientX - rect.left) * (1280 / rect.width),
        y: (ev.clientY - rect.top) * (800 / rect.height),
      });
      ev.preventDefault();
    }, true);

    doc.addEventListener("keydown", (ev) => {
      if (NAMED.has(ev.key)) { post("/key", { key: ev.key }); ev.preventDefault(); }
      else if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      else if (ev.key.length === 1) { post("/keys", { text: ev.key }); ev.preventDefault(); }
    }, true);
  }

  function post(path, body) {
    fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).catch(() => {});
  }

  // ------------------------------------------------------------- stream
  function connect() {
    ws = new WebSocket(wsProto + "//" + location.host + "/ws");

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.kind === "doc") {
        if (msg.parent) seedChild(msg);
        else seedRoot(msg);
        return;
      }

      if (msg.kind === "mut") {
        const entry = frames.get(msg.frame);
        if (!entry || !entry.doc || !entry.doc.body) {
          const list = queued.get(msg.frame) || [];
          list.push(msg.patch);
          queued.set(msg.frame, list);
          return;
        }
        if (!applyPatch(entry.doc, msg.patch)) {
          ws.send(JSON.stringify({ cmd: "resync" }));
        }
      }
    };

    ws.onopen = () => { mirror.addEventListener("load", () => {
      if (mirror.contentDocument) wireInput(mirror.contentDocument);
    }); };

    ws.onclose = () => setTimeout(connect, 400);
  }

  connect();
</script>
</body>
</html>
