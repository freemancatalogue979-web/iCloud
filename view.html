<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote view</title>
<style>
  html, body { height:100%; margin:0; background:#fff; overflow:hidden; }
  /* The captured page is laid out at the size it was captured at, and scaled
   * to fit. Sizing the frame to the window instead would reflow the page -
   * and a page reflowed to a different width puts every click in the wrong
   * place, and cuts off whatever does not fit. */
  #mirror {
    position:absolute; top:0; left:0;
    border:0; display:block; transform-origin: 0 0;
  }
</style>
</head>
<body>
  <!-- Only the mirrored page lives here. -->
  <iframe id="mirror" title="Mirrored page" sandbox="allow-same-origin"></iframe>

<script>
  const mirror = document.getElementById("mirror");
  const WIN_ID = "data-rb-frame";
  const NID = "data-rb-nid";
  const CANVAS_ATTR = "data-rb-canvas";
  const FALLBACK_ATTR = "data-rb-fallback";
  const SHADOW_SUFFIX = "/shadow";

  /* The size the page was captured at, and how far it is scaled down to fit
   * the window. The mirror shows the page at the size it was captured, so a
   * click in the mirror is at the same place on the page as it is on the
   * real thing. */
  let captured = { w: 0, h: 0 };
  let mirrorScale = 1;

  function fitMirror(size) {
    const w = (size && size.w) || 0;
    const h = (size && size.h) || 0;
    captured = { w: w, h: h };
    if (!w || !h) {
      mirror.style.width = "100%";
      mirror.style.height = "100%";
      mirror.style.transform = "";
      mirrorScale = 1;
      return;
    }
    const availW = window.innerWidth || mirror.clientWidth || w;
    const availH = window.innerHeight || mirror.clientHeight || h;
    const scale = Math.min(availW / w, availH / h) || 1;
    mirrorScale = scale;
    mirror.style.width = w + "px";
    mirror.style.height = h + "px";
    mirror.style.transform = "scale(" + scale + ")";
  }

  function mirrorMetrics() {
    return { scale: mirrorScale, w: captured.w, h: captured.h };
  }

  // windowId -> { doc, ids: Map<nodeId, Node> }
  const frames = new Map();

  const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
  let ws = null;

  /* Ids arrive as data-rb-nid attributes, so adoption is a lookup rather than a
   * positional zip - there is no element ordering that can drift out of step.
   * querySelectorAll does not cross into shadow roots, so those are descended
   * into explicitly. */
  function adopt(root, map) {
    if (!root) return;
    for (const el of root.querySelectorAll("*")) {
      const nid = el.getAttribute(NID);
      if (nid) map.set(nid, el);
      if (el.shadowRoot) {
        // A shadow root is addressed by the host's id, so both sides work
        // out the same address without a side channel.
        if (nid) map.set(nid + SHADOW_SUFFIX, el.shadowRoot);
        adopt(el.shadowRoot, map);
      }
    }
  }

  /* A canvas keeps its picture in pixels, so a cloned <canvas> is an empty
   * box. The capture ships the picture as a data URL and the mirror puts the
   * pixels back. The attribute is taken off once it has been used, so a later
   * scan only finds canvases that have not been painted yet.
   *
   * The mirror runs in a sandbox without allow-scripts, so the captured
   * page's scripts never run. Chromium also hides a canvas's intrinsic size
   * there, which leaves an inline canvas with no box at all - the specified
   * width is ignored, because without an intrinsic size it is not a replaced
   * element any more. Making it an inline-block gives it a box, and the
   * snapshot's width and height then apply. */
  function prepareCanvases(root) {
    if (!root || !root.querySelectorAll) return;
    for (const canvas of root.querySelectorAll("canvas")) {
      const url = canvas.getAttribute(CANVAS_ATTR);
      if (url) {
        canvas.removeAttribute(CANVAS_ATTR);
        const img = new Image();
        img.onload = () => {
          try {
            const ctx = canvas.getContext("2d");
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
          } catch (e) {}
        };
        img.onerror = () => {};
        img.src = url;
      }
      const view = canvas.ownerDocument && canvas.ownerDocument.defaultView;
      if (!view) continue;
      let display = "";
      try { display = view.getComputedStyle(canvas).display; } catch (e) { continue; }
      if (display === "inline") canvas.style.display = "inline-block";
    }
  }

  /* The captured stylesheet carries the page's own CSS. Alongside it the
   * agent ships a snapshot of every element's resolved styles as rules of
   * zero specificity, so the page's CSS decides and the snapshot only fills
   * in what could not be loaded. When new nodes arrive later their snapshot
   * rules have to be added to the sheet for the root they land in - a
   * document sheet does not reach into a shadow tree, so the sheet is chosen
   * by the parent's own root. */
  function fallbackSheetFor(node) {
    const root = node && node.getRootNode ? node.getRootNode() : null;
    const scope = root && root.querySelectorAll ? root : (node ? node.ownerDocument : null);
    if (!scope) return null;
    if (scope !== scope.ownerDocument) {
      // A shadow root's own stylesheet, if it has one. Adding an element to a
      // shadow tree is not invisible - :first-child and :last-child stop
      // matching what they matched - so the rules go into a stylesheet that
      // is already there.
      const own = scope.querySelectorAll("style");
      if (own.length) return own[own.length - 1];
      const style = scope.createElement("style");
      style.setAttribute(FALLBACK_ATTR, "");
      scope.appendChild(style);
      return style;
    }
    const existing = scope.querySelector("style[" + FALLBACK_ATTR + "]");
    if (existing) return existing;
    const style = scope.createElement("style");
    style.setAttribute(FALLBACK_ATTR, "");
    const head = scope.head || scope.documentElement;
    if (!head) return null;
    head.appendChild(style);
    return style;
  }

  function applyStyles(node, styles) {
    if (!styles) return;
    const ids = Object.keys(styles);
    if (!ids.length) return;
    let css = "";
    for (const id of ids) {
      const text = styles[id];
      if (!text) continue;
      css += ':where([' + NID + '="' + id + '"]){' + text + "}\n";
    }
    if (!css) return;
    const sheet = fallbackSheetFor(node);
    if (!sheet) return;
    sheet.appendChild(sheet.ownerDocument.createTextNode(css));
  }

  // --------------------------------------------------------------- ops
  function applyOps(entry, ops) {
    const { doc, ids } = entry;
    for (const op of ops) {
      if (op.op === "add") {
        const parent = ids.get(op.parent);
        if (!parent) return false;
        const template = doc.createElement("template");
        template.innerHTML = op.html;
        adopt(template.content, ids);
        prepareCanvases(template.content);
        const before = op.before ? ids.get(op.before) : null;
        if (before && before.parentNode === parent) parent.insertBefore(template.content, before);
        else parent.appendChild(template.content);
        applyStyles(parent, op.styles);

      } else if (op.op === "rm") {
        const node = ids.get(op.id);
        if (node && node.parentNode) node.parentNode.removeChild(node);
        ids.delete(op.id);

      } else if (op.op === "attr") {
        const el = ids.get(op.id);
        if (!el) return false;
        if (op.value === null) el.removeAttribute(op.name);
        else el.setAttribute(op.name, op.value);

      } else if (op.op === "children") {
        // The parent's own children, rewritten as a unit because bare text
        // nodes carry no id and cannot be added or removed individually.
        const parent = ids.get(op.parent);
        if (!parent) return false;
        const template = doc.createElement("template");
        template.innerHTML = op.html;
        adopt(template.content, ids);
        prepareCanvases(template.content);
        while (parent.firstChild) parent.removeChild(parent.firstChild);
        parent.appendChild(template.content);
        applyStyles(parent, op.styles);

      } else if (op.op === "text") {
        const parent = ids.get(op.parent);
        if (!parent) return false;
        const target = parent.childNodes[op.index];
        // If the index does not land on a text node the two documents have
        // drifted. Setting textContent here would replace every child of the
        // parent with one string - destroying the subtree and reporting
        // success. Ask for a resync instead.
        if (!target || target.nodeType !== 3) return false;
        target.data = op.text;

      } else if (op.op === "value") {
        const el = ids.get(op.id);
        if (!el) return false;
        // Only write what actually changed: assigning .value on a focused field
        // moves its caret to the end.
        if (op.value !== undefined && el.value !== op.value) el.value = op.value;
        if (op.checked !== undefined && el.checked !== op.checked) el.checked = op.checked;
      }
    }
    return true;
  }

  function requestResync() {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ cmd: "resync" }));
  }

  // ------------------------------------------------------------- frames
  function frameDoc(windowId) {
    if (windowId === "0") return frames.get("0");
    const parent = frames.get(windowId.slice(0, windowId.lastIndexOf(".")));
    if (!parent) return null;
    const el = parent.doc.querySelector("[" + WIN_ID + "=\"" + windowId + "\"]");
    return el ? el.contentDocument : null;
  }

  let pendingFrames = [];
  let pendingTimer = null;

  function fillFrame(frame) {
    const parentEntry = frames.get(frame.windowId.slice(0, frame.windowId.lastIndexOf(".")));
    if (!parentEntry) return false;
    const el = parentEntry.doc.querySelector("[" + WIN_ID + "=\"" + frame.windowId + "\"]");
    if (!el) return false;
    el.setAttribute("sandbox", "allow-same-origin");
    el.onload = () => {
      if (!el.contentDocument) return;
      const fmap = new Map();
      adopt(el.contentDocument, fmap);
      prepareCanvases(el.contentDocument);
      frames.set(frame.windowId, { doc: el.contentDocument, ids: fmap });
      wireInput(el.contentDocument);
    };
    el.srcdoc = frame.html;
    return true;
  }

  function drainPending() {
    const still = [];
    for (const frame of pendingFrames) if (!fillFrame(frame)) still.push(frame);
    pendingFrames = still;
    if (pendingFrames.length && !pendingTimer) {
      pendingTimer = setTimeout(() => { pendingTimer = null; drainPending(); }, 150);
    }
  }

  function seed(capturedFrames, viewport) {
    frames.clear();
    fitMirror(viewport);
    const root = capturedFrames.find((f) => f.windowId === "0") || capturedFrames[0];
    if (!root) return;
    mirror.onload = () => {
      const doc = mirror.contentDocument;
      if (!doc) return;
      const rootMap = new Map();
      adopt(doc, rootMap);
      prepareCanvases(doc);
      frames.set("0", { doc, ids: rootMap });
      wireInput(doc);
      // Tell the outer page it can drop its loading state now.
      try { window.parent.postMessage({ rb: "seeded" }, "*"); } catch (e) {}
      drainPending();
    };
    mirror.srcdoc = root.html;
    pendingFrames = capturedFrames.filter((f) => f !== root);
    if (!pendingTimer) pendingTimer = setTimeout(() => { pendingTimer = null; drainPending(); }, 150);
  }

  // -------------------------------------------------------------- input
  /* Where the pointer was, in the mirror's own coordinates.
   *
   * A click inside a frame - the sign-in form is one - is reported by that
   * frame, so its coordinates are relative to the frame, not to the mirror.
   * Adding each frame's own offset as the frames are climbed out of gives
   * the position in the mirror, which is the only frame the server knows
   * about. Without it, a click in a nested frame lands somewhere else
   * entirely. */
  function pointInMirror(ev) {
    let x = ev.clientX;
    let y = ev.clientY;
    let win = ev.target && ev.target.ownerDocument
      ? ev.target.ownerDocument.defaultView
      : null;
    /* Each frame's own offset is added as the frames are climbed out of, so
     * the point ends up in the captured page's coordinates - the only
     * coordinates the server can use. */
    while (win && win.frameElement && win.frameElement !== mirror) {
      const r = win.frameElement.getBoundingClientRect();
      x += r.left;
      y += r.top;
      win = win.parent;
    }
    return { x: x, y: y };
  }

  function wireInput(doc) {
    const NAMED = new Set(["Enter","Tab","Backspace","Delete","Escape",
      "ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Home","End","PageUp","PageDown"]);

    doc.addEventListener("mousedown", (ev) => {
      /* The position as a fraction of the captured page, not as pixels. The
       * server is driving a window of whatever size, so it has to be told
       * where the point is in proportion and it scales it to the window it
       * is actually driving. */
      const pt = pointInMirror(ev);
      const w = captured.w || mirror.getBoundingClientRect().width;
      const h = captured.h || mirror.getBoundingClientRect().height;
      post("/click", { x: pt.x / w, y: pt.y / h });
      ev.preventDefault();
    }, true);

    doc.addEventListener("keydown", (ev) => {
      if (NAMED.has(ev.key)) { post("/key", { key: ev.key }); ev.preventDefault(); }
      else if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      else if (ev.key.length === 1) { post("/keys", { text: ev.key }); ev.preventDefault(); }
    }, true);
  }

  function post(path, body) {
    fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).catch(() => {});
  }

  // ------------------------------------------------------------- stream
  function connect() {
    ws = new WebSocket(wsProto + "//" + location.host + "/ws");

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.kind === "doc") {
        seed(msg.frames || [], msg.viewport);
        return;
      }

      if (msg.kind === "mut") {
        const entry = frames.get(msg.windowId);
        if (!entry || !entry.doc || !entry.doc.body) return;
        if (!applyOps(entry, msg.ops || [])) requestResync();
      }
    };

    ws.onclose = () => setTimeout(connect, 400);
  }

  connect();
</script>
</body>
</html>
