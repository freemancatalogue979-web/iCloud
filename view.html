<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote view</title>
<style>
  html, body { height:100%; margin:0; background:#000; overflow:hidden; }

  #mirror { width:100%; height:100%; border:0; display:block; background:#fff; }

  #wait {
    position:absolute; inset:0; display:grid; place-items:center;
    color:#666; font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    pointer-events:none;
  }
  #wait.gone { display:none; }

  #hud {
    position:absolute; right:8px; bottom:8px;
    color:#666; font:10.5px ui-monospace,Menlo,Consolas,monospace;
    background:rgba(0,0,0,.6); padding:3px 7px; border-radius:5px;
    pointer-events:none;
  }
</style>
</head>
<body>
  <div id="wait">waiting for the page…</div>
  <iframe id="mirror" title="Mirrored page" sandbox="allow-same-origin"></iframe>
  <div id="hud"></div>

<script>
  const mirror = document.getElementById("mirror");
  const wait = document.getElementById("wait");
  const hud = document.getElementById("hud");

  let pageWidth = 1280;
  let pageHeight = 800;
  let applied = 0;
  let resyncs = 0;

  const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
  let ws = null;

  // ------------------------------------------------------------- resolve
  // Paths are index chains from <body>, produced by agent.js.
  function resolve(doc, sel) {
    if (!doc || !doc.body) return null;
    if (sel === "") return doc.body;
    let node = doc.body;
    for (const part of sel.split("/")) {
      if (!node || !node.children) return null;
      node = node.children[+part];
      if (!node) return null;
    }
    return node;
  }

  function applyPatch(doc, patch) {
    for (const p of patch) {
      const el = resolve(doc, p.sel);
      if (!el) return false;            // structure drifted - need a resync

      if (p.t === "a") {
        if (p.value === null) el.removeAttribute(p.name);
        else el.setAttribute(p.name, p.value);
      } else if (p.t === "t") {
        if (el.firstChild && el.firstChild.nodeType === 3) el.firstChild.data = p.value;
        else el.textContent = p.value;
      } else if (p.t === "h") {
        el.innerHTML = p.html;
      }
    }
    return true;
  }

  function seed(html, url) {
    // agent.js has already absolutized resources and injected the <base> tag,
    // so the serialised document can be dropped straight in.
    mirror.srcdoc = html;
  }

  // --------------------------------------------------------------- input
  // Clicks and keystrokes go to the real page; the DOM comes back as patches.
  mirror.addEventListener("load", () => {
    const doc = mirror.contentDocument;
    if (!doc) return;

    doc.addEventListener("mousedown", (ev) => {
      const rect = mirror.getBoundingClientRect();
      const x = (ev.clientX - rect.left) * (pageWidth / rect.width);
      const y = (ev.clientY - rect.top) * (pageHeight / rect.height);
      post("/click", { x, y });
      ev.preventDefault();
    }, true);

    doc.addEventListener("keydown", (ev) => {
      const NAMED = new Set(["Enter","Tab","Backspace","Delete","Escape",
        "ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Home","End","PageUp","PageDown"]);
      if (NAMED.has(ev.key)) { post("/key", { key: ev.key }); ev.preventDefault(); }
      else if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      else if (ev.key.length === 1) { post("/keys", { text: ev.key }); ev.preventDefault(); }
    }, true);

    // The mirror needs focus to receive keystrokes.
    doc.addEventListener("click", () => mirror.focus(), true);
  });

  function post(path, body) {
    fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }).catch(() => {});
  }

  // ------------------------------------------------------------ stream
  function connect() {
    ws = new WebSocket(wsProto + "//" + location.host + "/ws");

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.kind === "doc") {
        pageWidth = msg.width || pageWidth;
        pageHeight = msg.height || pageHeight;
        seed(msg.html, msg.url);
        wait.classList.add("gone");
      } else if (msg.kind === "mut") {
        const doc = mirror.contentDocument;
        if (!doc || !doc.body) return;
        if (!applyPatch(doc, msg.patch)) {
          resyncs++;
          ws.send(JSON.stringify({ cmd: "resync" }));
        } else {
          applied += msg.patch.length;
        }
      }
      hud.textContent = `${applied} patches · ${resyncs} resyncs`;
    };

    ws.onclose = () => setTimeout(connect, 400);
  }

  connect();
</script>
</body>
</html>
