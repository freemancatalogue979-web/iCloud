<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live browser view</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#080c11;color:#e6edf3;
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       display:flex;flex-direction:column;height:100vh}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
       padding:8px 11px;border-bottom:1px solid #22303c;background:#0d141b;flex:none}
  .url{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b9bab;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
       padding:3px 9px;border-radius:999px;border:1px solid #22303c;color:#8b9bab;
       white-space:nowrap}
  .tag.ok{color:#4ade80;border-color:#1f4a2c}
  .tag.warn{color:#fcd34d;border-color:#4d3d15}
  .tag.err{color:#fca5a5;border-color:#552320}
  .stage{flex:1;display:grid;place-items:center;padding:10px;overflow:auto}
  img{max-width:100%;max-height:100%;border-radius:7px;border:1px solid #22303c;
      display:block}
  .empty{color:#4a5a68;font-size:13px;text-align:center;padding:20px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid #22303c;
        border-top-color:#3b9eff;border-radius:50%;animation:s .8s linear infinite;
        vertical-align:-2px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="bar">
    <span id="url" class="url">no page yet</span>
    <span id="tag" class="tag">idle</span>
  </div>
  <div class="stage">
    <div id="empty" class="empty">
      <span class="spin"></span>waiting for the browser to launch…
    </div>
    <img id="shot" alt="Browser screenshot" hidden>
  </div>

<script>
(function () {
  var img = document.getElementById("shot");
  var empty = document.getElementById("empty");
  var urlEl = document.getElementById("url");
  var tagEl = document.getElementById("tag");
  var nonce = 0;

  function reload(n) {
    if (n && n <= nonce) return;
    nonce = n || nonce + 1;
    // Cache-buster: the server sends no-store, but be explicit.
    img.src = "/shot.png?n=" + encodeURIComponent(nonce) + "&t=" + Date.now();
  }

  img.onload = function () {
    empty.hidden = true;
    img.hidden = false;
  };
  img.onerror = function () { /* no screenshot yet; poll will retry */ };

  // Poll for fresh captures.
  setInterval(function () {
    fetch("/health").then(function (r) { return r.json(); }).then(function (h) {
      if (h.has_screenshot) reload(h.shot_nonce);
      tagEl.textContent = h.session_state.replace(/_/g, " ");
      tagEl.className = "tag " + (
        h.session_state === "ready" ? "ok"
          : h.session_state === "error" ? "err"
          : h.session_state === "idle" || h.session_state === "stopped" ? ""
          : "warn");
    }).catch(function () { /* server restarting */ });
  }, 2000);

  // The parent page tells us when a new capture exists.
  window.addEventListener("message", function (ev) {
    if (ev.origin !== location.origin) return;
    if (ev.data && ev.data.type === "reload") {
      reload(ev.data.nonce);
      if (ev.data.url) urlEl.textContent = ev.data.url;
    }
    if (ev.data && ev.data.type === "url") urlEl.textContent = ev.data.url;
  });

  reload(0);
})();
</script>
</body>
</html>
