<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCloud</title>
<style>
  html, body { height:100%; margin:0; }
  body { display:grid; place-items:center; background:#000; }

  .spinner {
    width:56px; height:56px; border-radius:50%;
    border:3px solid #1c1c1e; border-top-color:#fff;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg) } }

  .icon {
    width:128px; height:128px; border-radius:28px;
    background:#000; border:1px solid #1c1c1e;
    display:grid; place-items:center;
    box-shadow:0 18px 50px rgba(255,255,255,.08);
    animation:pop .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform:scale(.6); opacity:0 } }

  /* Same icon, but you can tell it failed. */
  .icon.failed { border-color:#5a1d1d; box-shadow:0 18px 50px rgba(255,69,58,.22); }
  .icon.failed svg { fill:#ff453a; }

  [hidden] { display:none !important; }
</style>
</head>
<body>
  <div id="spinner" class="spinner"></div>

  <div id="icon" class="icon" hidden>
    <svg width="64" height="64" viewBox="0 0 24 24" fill="#fff" aria-label="Apple">
      <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
    </svg>
  </div>

<script>
  // Poll only while it is still working; stop as soon as it finishes.
  const timer = setInterval(() => {
    fetch("/status").then(r => r.json()).then(show);
  }, 2000);

  fetch("/start").then(r => r.json()).then(show);

  function show(s) {
    const finished = s.status === "done" || s.status === "error";
    document.getElementById("spinner").hidden = finished;

    const icon = document.getElementById("icon");
    icon.hidden = !finished;
    icon.classList.toggle("failed", s.status === "error");

    if (finished) clearInterval(timer);
  }
</script>
</body>
</html>
