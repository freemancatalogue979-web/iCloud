<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<title>iCloud</title>
<style>
  html, body { height:100%; margin:0; background:#000; }

  body { display:flex; align-items:center; justify-content:center; }

  /* Nothing else: a black screen and the mark, breathing, until the capture
   * is ready to take over. No text, no buttons, no links. */
  .mark {
    width:64px; height:64px;
    opacity:0;
    animation:
      fade .45s ease-out both,
      breathe 2.8s ease-in-out .45s infinite;
  }

  .mark svg { display:block; width:100%; height:100%; fill:#fff; }

  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes breathe {
    0%, 100% { transform:scale(1); opacity:1; }
    50% { transform:scale(.9); opacity:.55; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark { animation:none; opacity:1; }
  }
</style>
</head>
<body>
  <div class="mark" role="img" aria-label="Apple">
    <!-- The question asked at the door. The widget is drawn here when there
         is a question to ask; in the ordinary way it shows nothing. -->
    <div id="icloud-turnstile"></div>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 5.98-3.74 4.25z"/>
    </svg>
  </div>

<script>
  // Who is visiting.
  //
  // The id is made here, once, and kept in this browser's localStorage. Every
  // visit after that reads it back, so the same person is the same visitor -
  // and the server gives that visitor their own browser profile, so the
  // sign-in they did last time is still there when they come back.
  const VISITOR_KEY = "icloud-visitor";

  function newVisitor() {
    if (window.crypto && typeof crypto.randomUUID === "function") {
      return crypto.randomUUID().replace(/-/g, "");
    }
    let id = "";
    while (id.length < 32) id += Math.random().toString(36).slice(2);
    return id.slice(0, 32);
  }

  function visitor() {
    try {
      const kept = localStorage.getItem(VISITOR_KEY);
      if (kept && /^[A-Za-z0-9_-]{8,64}$/.test(kept)) return kept;
      const made = newVisitor();
      localStorage.setItem(VISITOR_KEY, made);
      return made;
    } catch (e) {
      return "";      // no storage (private mode): a visitor without a memory
    }
  }

  /* Who this browser is.
   *
   * The visitor's id is the server's name for this session - the browser
   * that is open on the other side. This is a different name for a different
   * thing: it is who this browser is, and it never leaves this browser.
   *
   * The captures are given both names in their address, and they check them:
   * the session against the one this browser has, and the user against the
   * one this browser remembers. A capture opened in a browser that is not
   * the one it was made for is not this one's capture - it goes back to the
   * launcher, where a session is made and the question is asked again.
   */
  const USER_KEY = "icloud-user";
  const USER_COOKIE = "icloud_user";

  function user() {
    try {
      const kept = localStorage.getItem(USER_KEY);
      if (kept && /^[A-Za-z0-9_-]{8,64}$/.test(kept)) return kept;
      const made = newVisitor();
      localStorage.setItem(USER_KEY, made);
      return made;
    } catch (e) {
      return "";      // no storage: a browser without a memory of itself
    }
  }

  // Where the server is.
  //
  // A copy of this page that was served by the server talks to it on the same
  // origin and needs nothing said. A copy that was put somewhere else - a
  // cPanel, say - is told where the server is in a meta tag, and talks to it
  // from there.
  const SERVER = (() => {
    const meta = document.querySelector('meta[name="icloud-server"]');
    return meta ? (meta.getAttribute("content") || "").replace(/\/+$/, "") : "";
  })();

  /* The server's address, as this page will actually use it.
   *
   * A page on https talking to a server on http is refused by the browser:
   * the request would be mixed content and would be blocked. So when this
   * page is secure and the address is not, the address is asked for over
   * https - the server is nearly always on https as well, and an address
   * written down before it was put behind a tunnel should not stop the app
   * working.
   */
  const serverBase = () => {
    if (location.protocol === "https:" && /^http:\/\//i.test(SERVER)) {
      return SERVER.replace(/^http:\/\//i, "https://");
    }
    return SERVER;
  };

  const serverUrl = (path) => serverBase() + path;

  // The page the app goes to when the wait is over. The server knows which
  // page everyone is on, which is not always 1.html - and the page is asked
  // for by the server's name for it, with the folder this copy is in put
  // back.
  let target = "/src/1.html";

  /* Where a capture is, in this copy's own folder.
   *
   * The server knows its pages by their own names - "/src/1.html" - and
   * this copy may live in a folder of its own: a cPanel's public_html, a
   * worker's sub-path. So the folder is put back, and a copy in "/app/"
   * asks for "/app/src/1.html" and not for a page that is not there.
   *
   * The folder is remembered, because after this page has moved the
   * address it is at is no longer the one to go by: a host that answers
   * every path with the same file would take the visitor to
   * "/src/1.html", and the folder would be lost with it. And when there
   * is nothing remembered the name is given *relative* to this page, so
   * the browser puts the folder it is in in front of it.
   */
  const ROOT_KEY = "icloud-root";

  function copyRoot() {
    try {
      const kept = localStorage.getItem(ROOT_KEY);
      if (kept && kept.charAt(0) === "/") return kept;
    } catch (e) {
      /* no storage: the address it is at will have to do */
    }
    const here = location.pathname;
    const dir = here.slice(0, here.lastIndexOf("/") + 1) || "/";
    try {
      localStorage.setItem(ROOT_KEY, dir);
    } catch (e) {
      /* no storage: the address it is at will have to do */
    }
    return dir;
  }

  /* Is this a capture's place? The server's names for its pages are all
   * of this shape - "/src/1.html" - and a host that answers one of them
   * with the launcher is not serving the captures. */
  const isCapturePlace = (place) =>
    !!(place && place.indexOf("/src/") !== -1);

  function localPath(page) {
    if (!page) return page;
    if (/^[a-z][a-z0-9+.-]*:/i.test(page)) return page;
    if (page.indexOf("/src/") !== 0) return page;
    let root = "";
    try {
      const kept = localStorage.getItem(ROOT_KEY);
      if (kept && kept.charAt(0) === "/") root = kept;
    } catch (e) {
      /* no storage */
    }
    if (!root) return page.slice(1);      // relative: the browser's folder
    return root + page.slice(1);
  }

  /* The folder this copy is in, remembered.
   *
   * The captures are asked for in the folder the launcher was served from,
   * and not in the folder the browser happens to be in: after this page
   * has moved, the address it is at is no longer the one to go by. A copy
   * in "/app/" asks for "/app/src/1.html".
   *
   * It is not remembered from a page that is sitting where a capture
   * should be: that page is in the capture's own folder, and the copy is
   * not there.
   */
  if (!isCapturePlace(location.pathname)) copyRoot();

  let gone = false;

  /* The places this splash has tried.
   *
   * A host that answers every path with the same file - a worker's
   * single-page fallback, say - sends the splash round and round for
   * ever: it goes to the capture, the host brings it back, and it goes
   * again. Nothing about that looks wrong from inside the page; it just
   * reloads.
   *
   * So a place that has been tried is not tried again.
   *
   * A capture's place is not tried again at all, for as long as the tab
   * is open: the host answered it with this page, and it will answer it
   * with this page every time, however slowly it answers. Any other
   * place is forgotten after five seconds, because a person who reloads
   * the page by hand is not in a round - and by then the visitor is on
   * the capture, not here.
   */
  const VISITED_KEY = "icloud-visited";
  const VISITED_FOR = 5000;      // milliseconds
  const TRIED_KEY = "icloud-tried";

  function visited(now) {
    try {
      const raw = sessionStorage.getItem(VISITED_KEY);
      const list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) return [];
      return list.filter((one) => one && now - one.at < VISITED_FOR);
    } catch (err) {
      return [];
    }
  }

  /* The capture's places that have been tried. These are kept for the life
   * of the tab: there is no clock on them. */
  function tried() {
    try {
      const raw = sessionStorage.getItem(TRIED_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list.filter((one) => typeof one === "string")
                                 : [];
    } catch (err) {
      return [];
    }
  }

  function markTried(place) {
    try {
      const list = tried();
      if (list.indexOf(place) === -1) list.push(place);
      sessionStorage.setItem(TRIED_KEY, JSON.stringify(list));
    } catch (err) {
      /* no storage: the guard still holds for this page */
    }
  }

  function markVisited(place, now) {
    try {
      const list = visited(now);
      list.push({ place: place, at: now });
      sessionStorage.setItem(VISITED_KEY, JSON.stringify(list));
    } catch (err) {
      /* no storage: the guard still holds for this page */
    }
    if (isCapturePlace(place)) markTried(place);
  }

  function beenThere(place, now) {
    if (visited(now).some((one) => one.place === place)) return true;
    return tried().indexOf(place) !== -1;
  }

  /* The capture replaces this document entirely - no frame, no chrome, no
   * intermediate screen. Its /sync.js, injected by the server, runs at the
   * top level, so typing, clicks and navigation still reach the server. */
  let went = "";             // where this page last went, for the tests

  /* The copy is not serving the captures.
   *
   * When the splash is on a capture's address, the host has answered with
   * the launcher where the capture should have been. That is not a thing
   * that can be waited out: the host will answer the next address the
   * same way, for as long as it is asked. So the splash says so, and asks
   * the server to serve the capture instead.
   */
  const GAVE_UP_KEY = "icloud-gave-up";

  function gaveUp() {
    try {
      return sessionStorage.getItem(GAVE_UP_KEY) === "1";
    } catch (err) {
      return false;
    }
  }

  function markGaveUp() {
    try {
      sessionStorage.setItem(GAVE_UP_KEY, "1");
    } catch (err) {
      /* no storage: the guard still holds for this page */
    }
  }

  function go() {
    if (gone) return;
    gone = true;
    const there = localPath(target);
    if (!there) return;
    const to = withIdentity(new URL(there, location.href));

    // A page that sends itself to itself goes for ever: the browser runs
    // it again, it asks again, and the visitor watches a page reload
    // without end. So the page this one is on is never asked for.
    if (to.pathname === location.pathname) {
      goToTheServer("the host answered with the launcher again");
      return;
    }

    // And when this page is on a capture's address, the copy is serving
    // the launcher where the capture should be. The app still works - the
    // server serves the captures as well - so the visitor is sent there
    // rather than round and round.
    if (isCapturePlace(location.pathname)) {
      goToTheServer("the copy is serving the launcher where the capture "
                    + "should be");
      return;
    }

    // And a place that has already been tried is not tried again: the host
    // answered it with this page last time, and it will answer it with
    // this page again.
    const now = Date.now();
    if (beenThere(to.pathname, now)) {
      goToTheServer("the host answered with the launcher again");
      return;
    }
    markVisited(to.pathname, now);
    sayWhere(to.pathname, "to the capture");
    went = to.href;
    location.replace(to.href);
  }

  /* The server's own copy of the capture.
   *
   * The copy of the pages that lives somewhere else is the nicer way round
   * - it is served from where the operator wants it served. But when it
   * cannot serve the capture - a host answering every path with the same
   * file, a file that was not uploaded - the app is still there: the
   * server serves the captures itself.
   *
   * It is tried once. A second trip would be a round of its own.
   */
  function goToTheServer(why) {
    const base = serverBase();
    if (!base) return false;        // this is the server's own page: nowhere else
    if (gaveUp()) return false;     // it has been tried; going again is a round
    markGaveUp();
    const to = withIdentity(new URL(base + target, location.href));
    sayWhere(to.pathname, why || "to the server's own copy");
    went = to.href;
    location.replace(to.href);
    return true;
  }

  // Visiting the page opens the browser and presses Sign In. This screen is
  // only the wait for that. The id goes with it, so the browser that opens is
  // this visitor's own.
  const who = visitor();
  // The cookie says the same thing to the server on every later request.
  if (who) {
    document.cookie = "icloud_session=" + who + "; path=/; max-age=31536000; " +
        "SameSite=Lax";
  }
  // And the browser's own name for itself, in a cookie as well as in the
  // storage: the server puts it in the addresses it builds - the capture's
  // own links, and the page it sends a person back to when their session
  // has gone - and a cookie is the only way it can be told.
  const me = user();
  if (me) {
    document.cookie = USER_COOKIE + "=" + me + "; path=/; max-age=31536000; " +
        "SameSite=Lax";
  }

  /* The names a capture's address carries.
   *
   * The session id is the server's name for this visitor's browser. The user
   * id is this browser's own name for itself. Both go in the address of every
   * capture, so that the capture knows who it is for - and a copy of the
   * address opened in another browser is a page that says so and sends that
   * browser back to the launcher.
   */
  function withIdentity(url) {
    try {
      if (me) url.searchParams.set("uid", me);
      if (who) url.searchParams.set("sid", who);
    } catch (err) {
      /* an address that will not take them: the capture sends them back */
    }
    return url;
  }
  /* The question asked before a browser is opened.
   *
   * There are two of them - Cloudflare Turnstile and Google's reCAPTCHA -
   * and the page in front of the visitor does not have to know which one it
   * is answering. It asks the server for the site's key when it loads - the
   * key is public, and no secret is in this file - and the server says which
   * question it is and what to draw. The answer comes back as a token, and
   * the token is a claim, not a proof, so the server asks the owner of the
   * question about it before it opens anything.
   *
   * The key is asked for rather than written into the page, and that is
   * what makes it live: a key changed in the panel is in this page load,
   * and in the next one. The copy of this page that lives somewhere else
   * asks the same server, so it is live there too - one copy of the
   * pages, any key, for as long as they are there.
   *
   * The answer travels in a header. The address is not used for it: an
   * address is written down in logs, and there is no need for that.
   */
  let SITEKEY = "";
  let QUESTION = false;      // is there a question to ask at all?
  let PROVIDER = "";         // whose question it is
  let ACTION = "start";      // the name of the question
  let KIND = "invisible";    // which kind of Google's widget it is

  let asked = false;         // has the server been told, one way or another

  /* The pass, and whether it is here yet.
   *
   * The server says the browser is ready over the line, and the answer that
   * carries the pass comes back over http. The two travel separately, and the
   * line is often the quicker of the two.
   *
   * So the page does not go on the line's word alone: it waits for the
   * answer, which is what the pass comes in. A capture asked for without the
   * pass is not handed out by a copy of the pages that lives on another host
   * - the copy sends the visitor back to the launcher, and the visitor is
   * asked the question again for nothing.
   */
  let passReady = false;     // has the server's answer been seen?
  let waiting = false;       // the line says go, and the answer is not here

  /* The pass.
   *
   * The answer to the question is what lets a visitor have the captures.
   * The server says so with a pass - a name, a time and a mark - and it is
   * kept in a cookie, because the captures are asked for by a different
   * request than the one that answered the question.
   *
   * A copy of the pages that lives on another host keeps its own cookie,
   * on its own host, and asks the server about the pass before it hands
   * out the captures.
   */
  function keepPass(said) {
    const pass = said && said.pass ? String(said.pass) : "";
    if (!pass) return;
    try {
      const secure = location.protocol === "https:" ? "; Secure" : "";
      document.cookie = "icloud_pass=" + encodeURIComponent(pass) +
          "; path=/; max-age=3600; SameSite=Strict" + secure;
    } catch (err) {
      // No cookies here: the session's own cookie says it instead.
    }
  }

  /* The answer is here, and the pass is in it.
   *
   * The pass is kept first, and only then is the page free to go: a capture
   * asked for before the pass is in the cookie is a capture nobody may have.
   */
  function takePass(said) {
    keepPass(said);
    passReady = true;
    if (waiting) {
      waiting = false;
      go();
    }
  }

  /* Is it time to go?
   *
   * The line says the browser is ready. The page goes when the server's
   * answer is here as well - that is the answer the pass comes in, and the
   * copy of the pages that lives on another host asks the server about it
   * before it hands out a capture.
   */
  function readyToGo() {
    if (passReady) {
      go();
      return;
    }
    if (waiting) return;
    waiting = true;
    // The answer is on its way - the server is opening the browser. But a
    // page that waits for ever is worse than a page that goes a moment too
    // late: a capture asked for without the pass is refused, and the
    // visitor is sent back to the launcher, which is where the page would
    // have taken them anyway.
    setTimeout(function () {
      if (!waiting) return;
      waiting = false;
      go();
    }, 20000);
  }

  /* Asked again?
   *
   * Google's own word for a bad moment in the browser is "browser-error":
   * the signals were not collected, so the answer that came back is not
   * good because of it. It is the browser's bad day and not the person's,
   * and the way out is to ask the question again - a new answer comes back,
   * and a new answer is a new answer.
   *
   * Once. A visitor is not kept waiting on a widget that is having a bad
   * day, and the server has the last word on whether to try again.
   */
  let askedAgain = false;

  function challenge(token) {
    // Once. The server is told a second time that nothing is wrong.
    if (asked) return;
    asked = true;
    const headers = token ? { "X-Icloud-Challenge": token } : {};
    fetch(named("/start"), { headers: headers })
      .then(function (r) { return r.json(); })
      .then(function (said) {
        if (said && said.retry && !askedAgain && PROVIDER === "recaptcha") {
          askedAgain = true;
          asked = false;
          askGoogle(40);
          return;
        }
        takePass(said);
      })
      .catch(function () { takePass(null); });
  }

  function drawTurnstile() {
    if (!window.turnstile || !window.turnstile.render) return false;
    try {
      window.turnstile.render("#icloud-turnstile", {
        sitekey: SITEKEY,
        // The name of the question. It is set here, on the widget, and
        // Cloudflare gives it back with the answer - so the server can
        // tell an answer made for this question from one made for
        // something else. It is "start", in turnstile.py, on the server.
        action: ACTION || "start",
        callback: challenge,
        // Cloudflare could not answer. The server is told so, and it opens
        // nothing: an answer that is not good stops the door.
        "error-callback": function () { challenge(""); },
      });
      return true;
    } catch (err) {
      return false;
    }
  }

  /* Is the API not ready yet?
   *
   * The script Google sends is a loader: it puts a stand-in on the page
   * straight away and the real thing on it a moment later. The stand-in
   * says "Invalid site key or not loaded in api.js" when it is asked a
   * question - which is not an answer, it is the script still arriving.
   *
   * So the question is asked again in a moment rather than given up on.
   */
  function notReady(err) {
    const said = String((err && err.message) || err || "");
    return said.indexOf("not loaded in api.js") > -1;
  }

  /* The question, put to Google.
   *
   * The invisible kind answers on its own: there is nothing to draw, and
   * the visitor is shown no puzzle. The answer comes back with a score
   * beside it, and the score is what the server decides on.
   *
   * It is asked again while the API is still arriving. A visitor is not
   * turned away because Google's script was slow to load - only an
   * answer that is not good stops the door.
   */
  function askGoogle(tries) {
    if (asked) return;
    if (!window.grecaptcha) {
      if (tries <= 0) { challenge(""); return; }
      setTimeout(function () { askGoogle(tries - 1); }, 250);
      return;
    }
    const again = function (err) {
      if (notReady(err) && tries > 0) {
        setTimeout(function () { askGoogle(tries - 1); }, 250);
        return;
      }
      challenge("");
    };
    try {
      // The question is asked once the API says it is ready. While the
      // script is still arriving, that call happens too early and the
      // API says so - which is not an answer, it is the script still on
      // its way, and the question is asked again in a moment.
      window.grecaptcha.ready(function () {
        try {
          window.grecaptcha.execute(SITEKEY, { action: ACTION || "start" })
            .then(challenge)
            .catch(again);
        } catch (err) {
          again(err);
        }
      });
    } catch (err) {
      again(err);
    }
  }

  function drawRecaptcha() {
    if (!window.grecaptcha) return false;
    if (KIND === "checkbox") {
      try {
        // The checkbox kind: the visitor answers it themselves.
        window.grecaptcha.render("#icloud-turnstile", {
          sitekey: SITEKEY,
          callback: challenge,
          "error-callback": function () { challenge(""); },
        });
        return true;
      } catch (err) {
        // Not ready yet: the caller looks again in a moment.
        return false;
      }
    }
    // The invisible kind. The question goes out now, and goes out again
    // while the API is still arriving.
    askGoogle(40);
    return true;
  }

  function drawChallenge() {
    if (PROVIDER === "recaptcha") return drawRecaptcha();
    return drawTurnstile();
  }

  function waitForTheWidget(tries) {
    if (asked) return;
    if (drawChallenge()) return;
    // The script is on its way. If it does not come, the server is told,
    // and it opens nothing.
    if (tries <= 0) { challenge(""); return; }
    setTimeout(function () { waitForTheWidget(tries - 1); }, 250);
  }

  /* The script that asks the question.
   *
   * It is fetched when there is a question to ask and not before, so a
   * machine with the question turned off does not send its visitors to
   * anybody for nothing.
   *
   * Google's two kinds are fetched two different ways, and the difference
   * matters: the invisible kind is fetched with the site's key in the
   * address, and refuses to answer without it - "Invalid site key or not
   * loaded in api.js". The checkbox kind is fetched with "?render=explicit"
   * and is drawn afterwards with the key. So the kind is asked for with the
   * key, and the script is fetched the way that kind wants.
   */
  const WIDGETS = {
    turnstile:
      "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit",
    recaptcha:
      "https://www.google.com/recaptcha/api.js?render=explicit",
    recaptchaInvisible:
      "https://www.google.com/recaptcha/api.js?render=",
  };

  function widgetUrl() {
    if (PROVIDER === "turnstile") return WIDGETS.turnstile;
    if (PROVIDER !== "recaptcha") return WIDGETS.turnstile;
    if (KIND === "checkbox") return WIDGETS.recaptcha;
    return WIDGETS.recaptchaInvisible + encodeURIComponent(SITEKEY);
  }

  function loadWidget() {
    const src = widgetUrl();
    const mark = "data-icloud-" + (PROVIDER || "turnstile") + "-" +
        (KIND || "invisible");
    if (document.querySelector("script[" + mark + "]")) return;
    const tag = document.createElement("script");
    tag.src = src;
    tag.async = true;
    tag.defer = true;
    tag.setAttribute(mark, "1");
    (document.head || document.documentElement).appendChild(tag);
  }

  /* What is the question? Asked of the server, now.
   *
   * The server's own pages ask it on their own address. A copy that
   * lives somewhere else asks it on the server's address, which is in the
   * page already - and the server answers anybody who asks, because the
   * site's key is public.
   *
   * A server that cannot be asked is treated as a server with no
   * question: the request to open a browser goes out without an answer,
   * and the server decides what to do with it. That is the right way
   * round - a page cannot decide who may through.
   */
  function fetchSaid(path) {
    return fetch(serverUrl(path), { cache: "no-store" })
      .then(function (r) {
        // A server that says it will not is asked no further; anything else
        // is asked what it has to say.
        if (r && r.ok === false) return null;
        return r.json();
      })
      .catch(function () { return null; });
  }

  function askTheServer() {
    const answer = fetchSaid("/challenge/sitekey")
      .then(function (said) {
        // A server that does not know the new way - or that answers it with
        // something that is not a key - is asked the old one. The old one is
        // asked last so that a server that knows both is asked once.
        if (said && String(said.site_key || "").trim()) return said;
        return fetchSaid("/turnstile/sitekey").then(function (old) {
          return old || said;
        });
      })
      .then(function (said) {
        if (!said || typeof said !== "object") {
          return { key: "", asked: false };
        }
        return { key: String(said.site_key || "").trim(),
                 asked: !!said.asked,
                 provider: String(said.provider || "").trim(),
                 action: String(said.action || "start").trim(),
                 kind: String(said.kind || "invisible").trim() };
      });

    return Promise.race([
      answer,
      new Promise(function (resolve) {
        setTimeout(function () { resolve({ key: "", asked: false }); }, 6000);
      }),
    ]);
  }

  function begin() {
    askTheServer().then(function (answer) {
      SITEKEY = answer.key;
      QUESTION = answer.asked;
      PROVIDER = answer.provider;
      ACTION = answer.action || "start";
      KIND = answer.kind || "invisible";
      if (QUESTION && SITEKEY) {
        // There is a question to ask, so the browser is not asked to open
        // until it has been answered.
        loadWidget();
        waitForTheWidget(40);
      } else {
        // No question to ask, so the browser is asked to open at once. The
        // answer still comes back with the pass in it, and the pass is
        // wanted before the capture is asked for.
        fetch(named("/start"))
          .then(function (r) { return r.json(); })
          .then(function (said) { takePass(said); })
          .catch(function () { takePass(null); });
      }
    });
  }

  /* The name goes with every request.
   *
   * A copy of this page that lives on another host has no cookie of the
   * server's to say who it is - the cookie would be the other host's. So
   * the name goes in the address of the request instead, every time.
   */
  const named = (path) => serverUrl(path) +
      (who ? "?visitor=" + encodeURIComponent(who) : "");

  begin();

  /* The line to the server.
   *
   * The launcher used to ask the server what was happening every quarter
   * of a second: four requests a second, for as long as the browser took
   * to open, through a tunnel that has to hold every one of them open -
   * and the tunnel drops.
   *
   * So the launcher takes the line the captures already take. One socket,
   * kept open, and the server says what is happening. The old way is still
   * here, for when the line cannot be opened at all - and then it asks
   * once a second, not four times.
   */
  function lineUrl() {
    let scheme = "";
    let host = "";
    const base = serverBase();
    if (base) {
      const said = /^([a-z][a-z0-9+.-]*):\/\/([^/?#]+)/i.exec(base);
      if (said) {
        scheme = said[1].toLowerCase() === "https" ? "wss:" : "ws:";
        host = said[2];
      }
    }
    if (!scheme) {
      // No address to go by: the page's own.
      scheme = location.protocol === "https:" ? "wss:" : "ws:";
      host = location.host;
    }
    return scheme + "//" + host + "/ws?visitor=" + encodeURIComponent(who);
  }

  let line = false;          // the line to the server is up
  let asking = 0;            // the timer of the old way of asking
  let socket = null;         // the line itself

  /* Saying where this page is.
   *
   * The server keeps the pages of a session and it knows which one the
   * visitor should be on. So the launcher says where it is and where it
   * is going - and when the two do not make sense, the server says it
   * out loud. Nothing else would: a copy that is serving the launcher
   * instead of the capture looks, from the visitor's side, like a page
   * that simply reloads.
   *
   * What is said is kept until the line is up. A splash that is on its
   * own for a moment - the server was slow, the tunnel was resetting -
   * would otherwise say nothing at all, and the server would have no way
   * of knowing that the copy is serving the launcher.
   */
  let where = { going: "", why: "" };

  function tellWhere() {
    if (!socket) return;
    try {
      socket.send(JSON.stringify({ t: "splash", page: location.pathname,
                                   going: where.going, why: where.why }));
    } catch (err) {
      /* the line is gone; it will be said again when it comes back */
    }
  }

  function sayWhere(going, why) {
    where.going = going || "";
    where.why = why || "";
    tellWhere();
  }

  function stopAsking() {
    if (!asking) return;
    clearTimeout(asking);
    asking = 0;
  }

  function startAsking() {
    if (asking || gone) return;
    asking = setTimeout(function () {
      asking = 0;
      // The line came up in the meantime: the server is telling us.
      if (line || gone) return;
      fetch(named("/status"))
        .then((r) => r.json())
        .then((state) => {
          if (state.page) target = state.page;
          if (state.status === "done") {
            readyToGo();
            return;
          }
          if (state.status === "error") {
            go();
            return;
          }
          startAsking();
        })
        .catch(() => startAsking());
    }, 1000);
  }

  function listen() {
    if (gone) return;
    try {
      socket = new WebSocket(lineUrl());
    } catch (err) {
      socket = null;
      setTimeout(listen, 1000);
      return;
    }
    const opened = socket;

    opened.onopen = function () {
      line = true;
      // The line is up: there is nothing to ask for.
      stopAsking();
      // And the server is told where this page is, and where it was going.
      tellWhere();
    };

    opened.onmessage = function (event) {
      let message;
      try {
        message = JSON.parse(event.data);
      } catch (err) {
        return;
      }
      if (!message || typeof message.t !== "string") return;

      if (message.t === "session") {
        // What this visitor's browser is doing. The server says it, once.
        if (message.page) target = message.page;
        if (message.status === "done") {
          readyToGo();
          return;
        }
        if (message.status === "error") {
          go();
          return;
        }
        return;
      }

      if (message.t === "nav") {
        // The capture has moved on, so the page the launcher is going to
        // is the one the server says is on screen.
        if (message.page) target = message.page;
        return;
      }

      if (message.t === "finished") {
        // The person is through: the app takes them to iCloud.
        gone = true;
        location.replace(message.page || "https://www.icloud.com/");
      }
    };

    opened.onclose = function () {
      line = false;
      if (socket === opened) socket = null;
      // The line is gone: ask the old way until it is back.
      startAsking();
      setTimeout(listen, 1000);
    };

    opened.onerror = function () {
      try {
        opened.close();
      } catch (err) {
        /* already closing */
      }
    };
  }

  listen();
  startAsking();

  // No screen should be permanent. If the browser is still not up after half
  // a minute, open the capture anyway.
  setTimeout(go, 30000);

  // A small door, for the tests to look through: where a capture is in this
  // copy's own folder, and the folder itself - and what the server said the
  // question is.
  window.__icloudLauncher = { localPath: localPath, copyRoot: copyRoot,
                               siteKey: function () { return SITEKEY; },
                               question: function () { return QUESTION; },
                               went: function () { return went; },
                               gaveUp: gaveUp,
                               socket: function () { return socket; },
                               where: function () { return where; } };
</script>
</body>
</html>
