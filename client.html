<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCloud</title>
<style>
  html, body { height:100%; margin:0; background:#000; }

  #remote { width:100%; height:100%; border:0; display:block; background:#fff; }

  /* Sits on top of the mirror until the mirror has something to show. */
  #overlay {
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }

  .spinner {
    width:44px; height:44px;
    border:3px solid rgba(255,255,255,.18);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .icon { display:flex; animation:fade .3s ease-in; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }

  /* Errors are shown by colour only, never with text. */
  .icon.failed svg { fill:#ff453a; }

  [hidden] { display:none !important; }
</style>
</head>
<body>
  <iframe id="remote" src="/view" title="Remote browser"></iframe>

  <div id="overlay">
    <div id="spinner" class="spinner"></div>
    <div id="icon" class="icon" hidden>
      <svg width="64" height="64" viewBox="0 0 24 24" fill="#fff" aria-label="Apple">
        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
      </svg>
    </div>
  </div>

<script>
  const overlay = document.getElementById("overlay");
  const spinner = document.getElementById("spinner");
  const icon = document.getElementById("icon");

  // Visiting the page starts the browser.
  fetch("/start").catch(() => {});

  let seeded = false;
  let timer = null;

  function show(state) {
    if (seeded) return;
    spinner.hidden = state !== "wait";
    icon.hidden = state === "wait";
    icon.classList.toggle("failed", state === "error");
  }

  // The mirror says so when it has a real document to show.
  window.addEventListener("message", (ev) => {
    if (ev.data && ev.data.rb === "seeded") {
      seeded = true;
      clearInterval(timer);
      overlay.hidden = true;
    }
  });

  // Until then, /status decides whether to keep spinning or show the mark.
  function poll() {
    fetch("/status")
      .then((r) => r.json())
      .then((s) => {
        if (s.status === "error") show("error");
        else if (s.browser_open) show("icon");
        else show("wait");
      })
      .catch(() => {});
  }

  show("wait");
  poll();
  timer = setInterval(poll, 700);
</script>
</body>
</html>
