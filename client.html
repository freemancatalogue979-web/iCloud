<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCloud</title>
<style>
  html, body { height:100%; margin:0; }
  body { display:grid; place-items:center; background:#0b0f14; }

  .spinner {
    width:56px; height:56px; border-radius:50%;
    border:4px solid #1c2733; border-top-color:#3b9eff;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg) } }

  .icon {
    width:128px; height:128px; border-radius:28px;
    background:linear-gradient(160deg,#3b9eff,#0a5fd6);
    display:grid; place-items:center;
    box-shadow:0 18px 50px rgba(10,95,214,.35);
    animation:pop .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop { from { transform:scale(.6); opacity:0 } }

  [hidden] { display:none !important; }
</style>
</head>
<body>
  <div id="spinner" class="spinner"></div>

  <div id="icon" class="icon" hidden>
    <svg width="72" height="72" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
      <path d="M6.5 19a4.5 4.5 0 0 1-.4-8.98A6 6 0 0 1 17.7 9.2 3.9 3.9 0 0 1 17 19H6.5Z"/>
    </svg>
  </div>

<script>
  // Poll only while it is still working; stop as soon as it finishes.
  const timer = setInterval(() => {
    fetch("/status").then(r => r.json()).then(show);
  }, 2000);

  fetch("/start").then(r => r.json()).then(show);

  function show(s) {
    const finished = s.status === "done" || s.status === "error";
    document.getElementById("spinner").hidden = finished;
    document.getElementById("icon").hidden = !finished;
    if (finished) clearInterval(timer);
  }
</script>
</body>
</html>
