<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCloud</title>
<style>
  body { margin:0; height:100vh; display:grid; place-items:center;
         background:#0b0f14; color:#e6edf3;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  .box { text-align:center; max-width:560px; padding:24px; }
  h1 { font-size:20px; margin:0 0 18px; }
  #step { font-size:15px; color:#8b9bab; min-height:24px; }
  #url  { font:12px ui-monospace,Menlo,Consolas,monospace; color:#4a5a68;
          margin-top:14px; word-break:break-all; }
  #err  { color:#fca5a5; margin-top:14px; font-size:13px; white-space:pre-wrap; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%;
         background:#fcd34d; margin-right:8px; animation:p 1s infinite; }
  @keyframes p { 50% { opacity:.3 } }
  .ok  { color:#4ade80 }
</style>
</head>
<body>
  <div class="box">
    <h1>☁ iCloud</h1>
    <p id="step"><span class="dot"></span>starting…</p>
    <p id="url"></p>
    <p id="err"></p>
  </div>

<script>
  const step = document.getElementById("step");
  const url  = document.getElementById("url");
  const err  = document.getElementById("err");

  function render(s) {
    url.textContent = s.url || "";
    err.textContent = s.error || "";

    if (s.status === "running") {
      step.innerHTML = '<span class="dot"></span>' + s.step;
    } else if (s.status === "done") {
      step.innerHTML = '<span class="ok">✓</span> ' + s.step;
    } else if (s.status === "error") {
      step.innerHTML = '<span style="color:#fca5a5">✗</span> ' + s.step;
    }
  }

  // Visiting this page starts everything.
  fetch("/start").then(r => r.json()).then(render);

  // Keep the URL on screen up to date while you sign in.
  setInterval(() => fetch("/status").then(r => r.json()).then(render), 2000);
</script>
</body>
</html>
