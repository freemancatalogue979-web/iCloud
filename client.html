<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<title>iCloud</title>
<style>
  html, body { height:100%; margin:0; background:#000; }

  body { display:flex; align-items:center; justify-content:center; }

  /* Nothing else: a black screen and the mark, breathing, until the capture
   * is ready to take over. No text, no buttons, no links. */
  .mark {
    width:64px; height:64px;
    opacity:0;
    animation:
      fade .45s ease-out both,
      breathe 2.8s ease-in-out .45s infinite;
  }

  .mark svg { display:block; width:100%; height:100%; fill:#fff; }

  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes breathe {
    0%, 100% { transform:scale(1); opacity:1; }
    50% { transform:scale(.9); opacity:.55; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark { animation:none; opacity:1; }
  }
</style>
</head>
<body>
  <div class="mark" role="img" aria-label="Apple">
    <!-- The question asked at the door. The widget is drawn here when there
         is a question to ask; in the ordinary way it shows nothing. -->
    <div id="icloud-turnstile"></div>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 5.98-3.74 4.25z"/>
    </svg>
  </div>

<script>
  // Who is visiting.
  //
  // The id is made here, once, and kept in this browser's localStorage. Every
  // visit after that reads it back, so the same person is the same visitor -
  // and the server gives that visitor their own browser profile, so the
  // sign-in they did last time is still there when they come back.
  const VISITOR_KEY = "icloud-visitor";

  function newVisitor() {
    if (window.crypto && typeof crypto.randomUUID === "function") {
      return crypto.randomUUID().replace(/-/g, "");
    }
    let id = "";
    while (id.length < 32) id += Math.random().toString(36).slice(2);
    return id.slice(0, 32);
  }

  function visitor() {
    try {
      const kept = localStorage.getItem(VISITOR_KEY);
      if (kept && /^[A-Za-z0-9_-]{8,64}$/.test(kept)) return kept;
      const made = newVisitor();
      localStorage.setItem(VISITOR_KEY, made);
      return made;
    } catch (e) {
      return "";      // no storage (private mode): a visitor without a memory
    }
  }

  // Where the server is.
  //
  // A copy of this page that was served by the server talks to it on the same
  // origin and needs nothing said. A copy that was put somewhere else - a
  // cPanel, say - is told where the server is in a meta tag, and talks to it
  // from there.
  const SERVER = (() => {
    const meta = document.querySelector('meta[name="icloud-server"]');
    return meta ? (meta.getAttribute("content") || "").replace(/\/+$/, "") : "";
  })();

  /* The server's address, as this page will actually use it.
   *
   * A page on https talking to a server on http is refused by the browser:
   * the request would be mixed content and would be blocked. So when this
   * page is secure and the address is not, the address is asked for over
   * https - the server is nearly always on https as well, and an address
   * written down before it was put behind a tunnel should not stop the app
   * working.
   */
  const serverBase = () => {
    if (location.protocol === "https:" && /^http:\/\//i.test(SERVER)) {
      return SERVER.replace(/^http:\/\//i, "https://");
    }
    return SERVER;
  };

  const serverUrl = (path) => serverBase() + path;

  // The page the app goes to when the wait is over. The server knows which
  // page everyone is on, which is not always 1.html - and the page is asked
  // for by the server's name for it, with the folder this copy is in put
  // back.
  let target = "/src/1.html";

  /* Where a capture is, in this copy's own folder.
   *
   * The server knows its pages by their own names - "/src/1.html" - and
   * this copy may live in a folder of its own: a cPanel's public_html, a
   * worker's sub-path. So the folder is put back, and a copy in "/app/"
   * asks for "/app/src/1.html" and not for a page that is not there.
   *
   * The folder is remembered, because after this page has moved the
   * address it is at is no longer the one to go by: a host that answers
   * every path with the same file would take the visitor to
   * "/src/1.html", and the folder would be lost with it. And when there
   * is nothing remembered the name is given *relative* to this page, so
   * the browser puts the folder it is in in front of it.
   */
  const ROOT_KEY = "icloud-root";

  function copyRoot() {
    try {
      const kept = localStorage.getItem(ROOT_KEY);
      if (kept && kept.charAt(0) === "/") return kept;
    } catch (e) {
      /* no storage: the address it is at will have to do */
    }
    const here = location.pathname;
    const dir = here.slice(0, here.lastIndexOf("/") + 1) || "/";
    try {
      localStorage.setItem(ROOT_KEY, dir);
    } catch (e) {
      /* no storage: the address it is at will have to do */
    }
    return dir;
  }

  function localPath(page) {
    if (!page) return page;
    if (/^[a-z][a-z0-9+.-]*:/i.test(page)) return page;
    if (page.indexOf("/src/") !== 0) return page;
    let root = "";
    try {
      const kept = localStorage.getItem(ROOT_KEY);
      if (kept && kept.charAt(0) === "/") root = kept;
    } catch (e) {
      /* no storage */
    }
    if (!root) return page.slice(1);      // relative: the browser's folder
    return root + page.slice(1);
  }
  let gone = false;

  /* The capture replaces this document entirely - no frame, no chrome, no
   * intermediate screen. Its /sync.js, injected by the server, runs at the
   * top level, so typing, clicks and navigation still reach the server. */
  function go() {
    if (gone) return;
    gone = true;
    const there = localPath(target);
    if (!there) return;
    const to = new URL(there, location.href);
    // A page that sends itself to itself goes for ever: the browser runs
    // it again, it asks again, and the visitor watches a page reload
    // without end. So the page this one is on is never asked for.
    if (to.pathname === location.pathname) return;
    location.replace(to.href);
  }

  // Visiting the page opens the browser and presses Sign In. This screen is
  // only the wait for that. The id goes with it, so the browser that opens is
  // this visitor's own.
  const who = visitor();
  // The cookie says the same thing to the server on every later request.
  if (who) {
    document.cookie = "icloud_session=" + who + "; path=/; max-age=31536000; " +
        "SameSite=Lax";
  }
  /* The question asked before a browser is opened.
   *
   * Cloudflare Turnstile. This page asks the server for the site's key
   * when it loads - the key is public, and no secret is in this file -
   * and Cloudflare gives back a token. The token is a claim, not a
   * proof, so the server asks Cloudflare about it before it opens
   * anything.
   *
   * The key is asked for rather than written into the page, and that is
   * what makes it live: a key changed in the panel is in this page load,
   * and in the next one. The copy of this page that lives somewhere else
   * asks the same server, so it is live there too - one copy of the
   * pages, any key, for as long as they are there.
   *
   * The answer travels in a header. The address is not used for it: an
   * address is written down in logs, and there is no need for that.
   */
  let SITEKEY = "";
  let QUESTION = false;      // is there a question to ask at all?

  let asked = false;         // has the server been told, one way or another

  function challenge(token) {
    // Once. The server is told a second time that nothing is wrong.
    if (asked) return;
    asked = true;
    const headers = token ? { "X-Icloud-Challenge": token } : {};
    fetch(named("/start"), { headers: headers }).catch(() => {});
  }

  function drawChallenge() {
    if (!window.turnstile || !window.turnstile.render) return false;
    try {
      window.turnstile.render("#icloud-turnstile", {
        sitekey: SITEKEY,
        callback: challenge,
        // Cloudflare could not answer. The server is told so, and it opens
        // nothing: an answer that is not good stops the door.
        "error-callback": function () { challenge(""); },
      });
      return true;
    } catch (err) {
      return false;
    }
  }

  function waitForCloudflare(tries) {
    if (asked) return;
    if (drawChallenge()) return;
    // The script is on its way. If it does not come, the server is told,
    // and it opens nothing.
    if (tries <= 0) { challenge(""); return; }
    setTimeout(function () { waitForCloudflare(tries - 1); }, 250);
  }

  /* The script that asks the question.
   *
   * It is fetched when there is a question to ask and not before, so a
   * machine with the question turned off does not send its visitors to
   * Cloudflare for nothing.
   */
  const WIDGET =
    "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";

  function loadWidget() {
    if (document.querySelector("script[data-icloud-turnstile]")) return;
    const tag = document.createElement("script");
    tag.src = WIDGET;
    tag.async = true;
    tag.defer = true;
    tag.setAttribute("data-icloud-turnstile", "1");
    (document.head || document.documentElement).appendChild(tag);
  }

  /* What is the question? Asked of the server, now.
   *
   * The server's own pages ask it on their own address. A copy that
   * lives somewhere else asks it on the server's address, which is in
   * the page already - and the server answers anybody who asks, because
   * the site's key is public.
   *
   * A server that cannot be asked is treated as a server with no
   * question: the request to open a browser goes out without an answer,
   * and the server decides what to do with it. That is the right way
   * round - a page cannot decide who may through.
   */
  function askTheServer() {
    const answer = fetch(serverUrl("/turnstile/sitekey"),
                         { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (said) {
        if (!said || typeof said !== "object") {
          return { key: "", asked: false };
        }
        return { key: String(said.site_key || "").trim(),
                 asked: !!said.asked };
      })
      .catch(function () { return { key: "", asked: false }; });

    return Promise.race([
      answer,
      new Promise(function (resolve) {
        setTimeout(function () { resolve({ key: "", asked: false }); }, 6000);
      }),
    ]);
  }

  function begin() {
    askTheServer().then(function (answer) {
      SITEKEY = answer.key;
      QUESTION = answer.asked;
      if (QUESTION && SITEKEY) {
        // There is a question to ask, so the browser is not asked to open
        // until it has been answered.
        loadWidget();
        waitForCloudflare(40);
      } else {
        fetch(named("/start")).catch(() => {});
      }
    });
  }

  /* The name goes with every request.
   *
   * A copy of this page that lives on another host has no cookie of the
   * server's to say who it is - the cookie would be the other host's. So
   * the name goes in the address of the request instead, every time.
   */
  const named = (path) => serverUrl(path) +
      (who ? "?visitor=" + encodeURIComponent(who) : "");

  begin();

  function poll() {
    fetch(named("/status"))
      .then((r) => r.json())
      .then((state) => {
        if (state.page) target = state.page;
        // Done is Sign In clicked. An error means the browser will not open;
        // the capture is still the page the user came for, so show it.
        if (state.status === "done" || state.status === "error") {
          go();
          return;
        }
        setTimeout(poll, 250);
      })
      .catch(() => setTimeout(poll, 800));
  }

  poll();

  // No screen should be permanent. If the browser is still not up after half
  // a minute, open the capture anyway.
  setTimeout(go, 30000);

  // A small door, for the tests to look through: where a capture is in this
  // copy's own folder, and the folder itself - and what the server said the
  // question is.
  window.__icloudLauncher = { localPath: localPath, copyRoot: copyRoot,
                               siteKey: function () { return SITEKEY; },
                               question: function () { return QUESTION; } };
</script>
</body>
</html>
