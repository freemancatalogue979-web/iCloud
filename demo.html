<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iCloud - local demo</title>
<style>
  /* A stand-in for the landing page. The shape is the one the server looks
   * for: a custom element carrying the sign-in-button class. */
  html, body { height:100%; margin:0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#fbfbfd; color:#1d1d1f;
  }
  .hero { text-align:center; padding:140px 24px; }
  h1 { font-size:48px; margin:0 0 10px; font-weight:600; }
  .sub { color:#6e6e73; font-size:19px; margin:0 0 36px; }
  ui-button.sign-in-button {
    display:inline-block; background:#0071e3; color:#fff; border:0;
    border-radius:980px; padding:12px 26px; font-size:17px; cursor:pointer;
    font-family:inherit;
  }
  ui-button.sign-in-button:hover { background:#0077ed; }
</style>
</head>
<body>
  <div class="hero">
    <h1>iCloud</h1>
    <p class="sub">A local stand-in for icloud.com, so the mirror can be seen<br>
       without a route to Apple.</p>
    <ui-button class="sign-in-button" id="signin">Sign In</ui-button>
  </div>

  <script>
    // The sign-in form is on a page of its own, and the form itself is in a
    // frame - which is what makes it interesting.
    document.getElementById('signin').addEventListener('click', () => {
      location.href = '/demo-form';
    });
  </script>
</body>
</html>
